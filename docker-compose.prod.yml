# TissuePlex — production docker-compose
#
# Differences from docker-compose.yml:
#   - Caddy service added: handles HTTPS and automatic TLS certificates
#   - frontend and backend ports are NOT exposed to the host directly;
#     all external traffic goes through Caddy on ports 80/443
#
# Usage (on the server, after running deploy.sh):
#   DATA_PATH=/mnt/tissuplex-data docker compose -f docker-compose.prod.yml up -d --build
#
# Or with an env file:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ${DATA_PATH:-./sample_data}:/data:ro
      - dzi_cache:/cache
    environment:
      DATA_ROOT: /data
      CACHE_DIR: /cache
      # Unset → sized from available memory. See docker-compose.yml for why a
      # fixed default is unsafe. Override in .env.prod if you need a tighter cap.
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-}
      # DuckDB worker threads (default: the CPUs the container can see, max 8)
      # and how many viewport queries may run at once (default: about half
      # that, min 2). One shared DuckDB instance serves every request, so these
      # are process-wide caps — the old per-request pools could oversubscribe
      # a two-core VM several times over.
      DUCKDB_THREADS: ${DUCKDB_THREADS:-}
      QUERY_CONCURRENCY: ${QUERY_CONCURRENCY:-}
      # Memory budget (MB) for the per-viewport LRM score matrices that make an
      # LRM toggle a few milliseconds instead of a re-scan. Default: 8% of the
      # memory ceiling, at most 256 MB. Oversized viewports fall back to SQL.
      SCORE_CACHE_MB: ${SCORE_CACHE_MB:-}
      # Requests slower than this are written to the log file (ms).
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-2000}
      # Logs go to $CACHE_DIR/logs/tissueplex.log (rotating, 5 x 5 MB), on the
      # dzi_cache volume, so they survive a container restart or OOM kill.
      # Read them with:  docker compose exec backend tail -n 200 /cache/logs/tissueplex.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    stop_grace_period: 5m
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-12g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dzi_cache:
  caddy_data:
  caddy_config:
