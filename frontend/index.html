<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TissuePlex</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
      /* `hidden` still lets the browser scroll the page to reach a focused
         element, which once slid the whole app off-screen. `clip` cannot be
         scrolled at all; browsers without it keep `hidden` above. */
      html, body { overflow: clip; }
      @keyframes tp-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
